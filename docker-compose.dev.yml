# Lokale Entwicklungsumgebung für (Pro)VaCaSy
# Starten: docker compose -f docker-compose.dev.yml up -d
# Backend und Frontend laufen dabei lokal (IDE bzw. npm run dev), nicht im Container.
# Alle Ports sind nur auf dem eigenen Rechner (127.0.0.1) erreichbar.

services:
  # Datenbank der Anwendung (Backend: jdbc:postgresql://localhost:5432/provacasy)
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: provacasy
      POSTGRES_USER: provacasy
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-provacasy}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provacasy -d provacasy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Eigene Datenbank für Keycloak (von außen nicht erreichbar)
  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Keycloak im Entwicklungsmodus: http://localhost:8080
  # Realm hse wird beim Start aus dem Ordner keycloak/ importiert (falls vorhanden).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  # Test-Mailserver: SMTP localhost:1025, Weboberfläche http://localhost:8025
  mailhog:
    image: mailhog/mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  db-data:
  keycloak-db-data:
