# (Pro)VaCaSy auf der Test-VM: alles als Container
# Vorbereitung: .env.bwcloud aus .env.example anlegen und Werte setzen.
# Starten:      docker compose --env-file .env.bwcloud pull
#               docker compose --env-file .env.bwcloud up -d
# Jeder docker compose Befehl für diese Datei braucht --env-file .env.bwcloud.
# Die Images kommen aus GitHub Packages (ghcr.io/provacasy/...).

services:
  # Reverse Proxy: leitet nach Domain an Frontend, Backend und Keycloak weiter
  nginx:
    image: nginx:stable-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN fehlt, in .env.bwcloud setzen und mit --env-file .env.bwcloud starten}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN fehlt, in .env.bwcloud setzen und mit --env-file .env.bwcloud starten}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN fehlt, in .env.bwcloud setzen und mit --env-file .env.bwcloud starten}
      HTTP_PORT: ${HTTP_PORT:-8080}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - frontend
      - backend
      - keycloak
    restart: unless-stopped

  frontend:
    image: ghcr.io/provacasy/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped

  backend:
    image: ghcr.io/provacasy/backend:${IMAGE_TAG:-latest}
    environment:
      # Im Container bleibt das Backend auf 8080 (nginx leitet an backend:8080), lokal gilt 8081 aus application.properties
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/provacasy
      SPRING_DATASOURCE_USERNAME: provacasy
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD fehlt, in .env.bwcloud setzen und mit --env-file .env.bwcloud starten}
      # Der Issuer ist die öffentliche Adresse von Keycloak (steht so im Token).
      # Die Schlüssel holt das Backend direkt über das interne Netz.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://${AUTH_DOMAIN}:${HTTP_PORT:-8080}/realms/hse
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/hse/protocol/openid-connect/certs
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Datenbank der Anwendung (von außen nicht erreichbar)
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: provacasy
      POSTGRES_USER: provacasy
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD fehlt, in .env.bwcloud setzen und mit --env-file .env.bwcloud starten}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provacasy -d provacasy"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Eigene Datenbank für Keycloak (von außen nicht erreichbar)
  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD fehlt, in .env.bwcloud setzen und mit --env-file .env.bwcloud starten}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD fehlt, in .env.bwcloud setzen und mit --env-file .env.bwcloud starten}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD fehlt, in .env.bwcloud setzen und mit --env-file .env.bwcloud starten}
      KC_HOSTNAME: http://${AUTH_DOMAIN}:${HTTP_PORT:-8080}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  # Test-Mailserver: Weboberfläche nur auf der VM selbst (Zugriff per SSH Tunnel)
  # ssh -L 8025:localhost:8025 <benutzer>@<vm>
  mailhog:
    image: mailhog/mailhog
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  db-data:
  keycloak-db-data: